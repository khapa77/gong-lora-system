; ============================================================
;  Gong LoRa CLIENT — PlatformIO configuration
;  Flash as many clients as you need (change CLIENT_ID each time)
; ============================================================
[env:esp32dev]
; Official platform to avoid ADC driver_ng vs legacy conflict (pioarduino stable triggered it)
platform     = espressif32 @ 6.7.0
board        = esp32dev
framework    = arduino

monitor_speed  = 115200
monitor_rts    = 0
monitor_dtr    = 0
upload_speed   = 115200

; M-18: SPIFFS is legacy in arduino-esp32 (degrades as it fills, slow
; openNextFile(), survives a power loss mid-write worse than LittleFS).
; LittleFS.h ships in this core (2.0.16) already — no extra lib needed.
board_build.filesystem = littlefs
board_build.partitions = partitions_large_spiffs.csv
extra_scripts = pre:scripts/clean_data.py   ; M-19: strip .DS_Store etc before uploadfs

lib_deps =
    bblanchon/ArduinoJson          @ ^6.21.5
    jgromes/RadioLib                @ ^6.6.0
    https://github.com/schreibfaul1/ESP32-audioI2S#2.0.6
    adafruit/RTClib                @ ^2.1.4

; Coredump (ENABLE/DATA_FORMAT_ELF/CHECKSUM_CRC32/STACK_SIZE) is already on
; by default in this framework's sdkconfig.h (arduino-esp32 2.0.16) with the
; same values — redefining them here only produced "redefined" warnings.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I../common
    ; H-7: override the placeholder HMAC key at build time instead of editing
    ; config.h — export GONG_KEY (>=16 chars, must match the server) before
    ; building, then uncomment:
    ; -DLORA_HMAC_KEY='"${sysenv.GONG_KEY}"'
