[env:esp32dev]
; Official platform to avoid ADC driver_ng vs legacy conflict (pioarduino stable triggered it)
platform     = espressif32 @ 6.7.0
board        = esp32dev
framework    = arduino

monitor_speed  = 115200
monitor_rts    = 0
monitor_dtr    = 0
upload_speed   = 115200

board_build.filesystem = spiffs
; ~2.5 МБ под SPIFFS (два MP3 по ~1 МБ + веб/конфиги). Без OTA.
board_build.partitions = partitions_large_spiffs.csv
board_build.esp_task_wdt_timeout_s = 15

lib_deps =
    bblanchon/ArduinoJson          @ ^6.21.5
    https://github.com/schreibfaul1/ESP32-audioI2S#2.0.6
    adafruit/RTClib                @ ^2.1.4


build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ESP_COREDUMP_ENABLE=1
    -DCONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=y
    -DCONFIG_ESP_COREDUMP_CHECKSUM_CRC32=y
    -DCONFIG_ESP_COREDUMP_MAX_TASKS_SNAPSHOT=8
    -DCONFIG_ESP_COREDUMP_STACK_SIZE=1024


