[env:esp32dev]
; Official platform to avoid ADC driver_ng vs legacy conflict (pioarduino stable triggered it)
platform     = espressif32 @ 6.7.0
board        = esp32dev
framework    = arduino

monitor_speed  = 115200
monitor_rts    = 0
monitor_dtr    = 0
upload_speed   = 115200
#upload_speed   = 230400

; M-18: SPIFFS is legacy in arduino-esp32 — degrades as it fills, no real
; directories, 32-char name limit, slow openNextFile(), and survives a power
; loss mid-write worse than LittleFS. Power here drops without warning
; (that's the whole reason C-2/M-8 exist), so this matters more than usual.
; LittleFS.h ships in this core (2.0.16) already — no extra lib needed.
board_build.filesystem = littlefs
; ~2.5 МБ под LittleFS (два MP3 по ~1 МБ + веб/конфиги). Без OTA.
board_build.partitions = partitions_large_spiffs.csv
extra_scripts = pre:scripts/clean_data.py   ; M-19: strip .DS_Store etc before uploadfs

lib_deps =
    bblanchon/ArduinoJson          @ ^6.21.5
    https://github.com/schreibfaul1/ESP32-audioI2S#2.0.6
    adafruit/RTClib                @ ^2.1.4
    jgromes/RadioLib                @ ^6.6.0


; Coredump (ENABLE/DATA_FORMAT_ELF/CHECKSUM_CRC32/STACK_SIZE) is already on
; by default in this framework's sdkconfig.h (arduino-esp32 2.0.16) with the
; same values — redefining them here only produced "redefined" warnings.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I../common
    ; H-7: override the placeholder HMAC key at build time instead of editing
    ; config.h — export GONG_KEY (>=16 chars, must match on every device)
    ; before building, then uncomment:
    ; -DLORA_HMAC_KEY='"${sysenv.GONG_KEY}"'

